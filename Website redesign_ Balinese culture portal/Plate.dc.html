<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;min-height:160px;background:repeating-linear-gradient(135deg,#E7DCC6 0 9px,#DED0B4 9px 18px);border:1px solid #C9BBA2;display:flex;align-items:flex-end;padding:12px;box-sizing:border-box;overflow:hidden">
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,rgba(255,252,244,.55),rgba(255,252,244,0) 70%)"></div>
  <span style="position:relative;font:400 10px/1.3 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#7C6B51;background:#F5F0E6;padding:5px 9px;border:1px solid #C9BBA2;max-width:100%">{{ label }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:260},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;photo&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
